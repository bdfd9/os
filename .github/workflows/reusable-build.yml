name: reusable-build
on:
  workflow_call:
    inputs:
      recipe:
        type: string
        required: true
    secrets:
      SIGNING_SECRET:
        required: true
      SECUREBOOT_PRIVATE_KEY:
        required: true

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.recipe }}
  cancel-in-progress: true

permissions: {}

jobs:
  bluebuild:
    name: image
    runs-on: ubuntu-slim
    permissions:
      contents: read
      packages: write
      id-token: write
    environment: Build
    outputs:
      FULL_IMAGE_REF: ${{ steps.runner_setup.outputs.FULL_IMAGE_REF }}
      IMAGE_DIGEST: ${{ steps.image_manifest_metadata.outputs.IMAGE_DIGEST }}

    steps:
      # - name: Checkout
      #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      #   with:
      #     persist-credentials: false
      - name: Setup
        run: |
          sudo apt install docker-ce
          sudo systemctl enable --now docker.socket

      - name: List installed packages
        run: |
          apt list --installed

      - name: Maximize build space
        run: |
          set -x

          sudo docker image prune --all --force > /dev/null
          sudo rm -rf ${verbose} /usr/share/dotnet
          sudo rm -rf ${verbose} /usr/local/lib/android
          sudo rm -rf ${verbose} /opt/ghc
          sudo rm -rf ${verbose} /usr/local/.ghcup
          sudo rm -rf ${verbose} /usr/local/.ghcu

          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y '^clang-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          if [[ "$(uname -m)" == "x86_64" ]]; then
            sudo apt-get remove -y google-chrome-stable microsoft-edge-stable > /dev/null
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null
          fi
          sudo apt-get remove -y azure-cli firefox mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null

      - name: Build Image
        uses: blue-build/github-action@v1.12
        env:
          SECUREBOOT_PRIVATE_KEY: ${{ secrets.SECUREBOOT_PRIVATE_KEY }}
        with:
          recipe: ${{ inputs.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          squash: true
          chunkah: true
          max_layers: 128
          # skip_checkout: true
          use_cache: false
          retry_push_count: 3
          verify_install: true
