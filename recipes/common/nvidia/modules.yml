# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: files
    files:
      - source: system/nvidia
        destination: /

  - type: script
    scripts:
      - nvidia/install-kmod.sh

  - type: script
    scripts:
      - nvidia/install-packages.sh
      - nvidia/remove-nvidia-repos.sh
