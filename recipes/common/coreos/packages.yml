# yaml-language-server: $schema=https://schema.blue-build.org/modules/dnf-v1.json

type: dnf
install:
  packages:
    - cockpit-files
    - cockpit-machines
    - cockpit-networkmanager
    - cockpit-ostree
    - cockpit-podman
    - cockpit-selinux
    - cockpit-storaged
    - cockpit-system
    - firewalld
    - lsscsi
    - pcp
    - pcp-system-tools
    - procinfo
    - udisks2
    - usbguard

remove:
  auto-remove: true
  packages:
    - docker-cli
    - moby-engine
    - moby-filesystem
    - podman-docker
