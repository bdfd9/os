# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: script
    secrets:
      - type: env
        name: SECUREBOOT_PRIVATE_KEY
        mount:
          type: file
          destination: /tmp/certs/private_key.priv
    scripts:
      - final/regenerate-initramfs.sh
      - final/sign-kernel-and-modules.sh
      - final/remove-sudo.sh
      - final/remove-suid.sh
      - final/remove-unused-repos.sh
      - final/enable-preset-services.sh
