# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
version: 2

base:
  image:
    registry: quay.io
    repository: fedora/fedora-kinoite
    tag: 44

metadata:
  name: kinoite-main
  description: This is my personal OS image.

spec:
  platforms:
    - linux/amd64
  # - linux/arm64

modules:
  - from-file: common/common-modules.yml
  - from-file: common/desktop/modules.yml
  - from-file: common/kinoite/modules.yml
  - from-file: common/proprietary-modules.yml
  - from-file: common/selinux-modules.yml
  - from-file: common/final-modules.yml
